<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol - Kütüphane</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 450px; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>

<div class="login-card text-center">
    <div class="mb-4">
        <i class="fas fa-user-plus fa-3x text-success"></i>
        <h3 class="mt-3 fw-bold">Aramıza Katıl</h3>
        <p class="text-muted">Kütüphane üyelik formu</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/kayit" method="POST">
        <div class="mb-3 text-start">
            <label class="form-label">Ad Soyad</label>
            <input type="text" name="ad_soyad" class="form-control" required>
        </div>
        <div class="mb-3 text-start">
            <label class="form-label">Telefon</label>
            <input type="text" name="telefon" class="form-control" placeholder="0555...">
        </div>
        <div class="mb-3 text-start">
            <label class="form-label">E-posta</label>
            <input type="email" name="eposta" class="form-control" required>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label">Şifre Belirle</label>
            <input type="password" name="sifre" class="form-control" required>
        </div>
        
        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Kayıt Ol</button>
    </form>
    
    <div class="mt-4 border-top pt-3">
        <p class="text-muted">Zaten hesabın var mı? <a href="/giris" class="text-primary fw-bold text-decoration-none">Giriş Yap</a></p>
    </div>
</div>

<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
